<script>
    async function loadMenuData() {
        try {
            const resp = await fetch('/.netlify/functions/get_tienda?limit=2000');
            const data = await resp.json();
            
            const categories = [...new Set(data.map(p => p.category).filter(Boolean))].sort();
            const brands = [...new Set(data.map(p => p.brand).filter(Boolean))].sort();

            const renderBlocks = (items, targetId, type) => {
                const container = document.getElementById(targetId);
                let html = '';
                // Hacemos 3 bloques de 5
                for(let i = 0; i < 3; i++) {
                    const blockItems = items.slice(i * 5, (i + 1) * 5);
                    html += `<div><ul class="space-y-3 text-gray-600 text-[14px]">`;
                    blockItems.forEach(item => {
                        html += `<li><a href="colecciones.html?${type}=${encodeURIComponent(item)}" class="hover:text-black hover:underline">${item}</a></li>`;
                    });
                    html += `</ul></div>`;
                }
                container.innerHTML = html;
            };

            renderBlocks(categories, 'mega-menu-categories', 'category');
            renderBlocks(brands, 'mega-menu-brands', 'brand');
        } catch(e) { console.error("Error cargando menús:", e); }
    }
    document.addEventListener('DOMContentLoaded', loadMenuData);
</script>
