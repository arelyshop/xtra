<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <!-- Tailwind CSS (CDN para usarlo sin instalar nada) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilos básicos para que el editor de texto parezca un Word */
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block; /* For Firefox */
        }
        #descriptionEditor ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        #descriptionEditor ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        #descriptionEditor b, #descriptionEditor strong { font-weight: 700; }
        #descriptionEditor i, #descriptionEditor em { font-style: italic; }
        #descriptionEditor h1 { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0; }
        #descriptionEditor h2 { font-size: 1.25rem; font-weight: 700; margin: 0.5rem 0; }
        #descriptionEditor p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Cabecera -->
        <div class="mb-8 flex items-center gap-3">
            <i data-lucide="package" class="h-8 w-8 text-indigo-600"></i>
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Gestión de Productos</h1>
                <p class="text-slate-500 mt-1">Registra nuevos productos (Vanilla HTML/JS)</p>
            </div>
        </div>

        <!-- Alertas -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-lg flex items-center gap-3 border">
            <i id="alertIcon" data-lucide="info" class="h-5 w-5"></i>
            <p id="alertMessage" class="font-medium"></p>
        </div>

        <!-- Formulario -->
        <form id="productForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Columna Principal -->
                <div class="md:col-span-2 space-y-6">
                    
                    <!-- Información Básica -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 border-b pb-2">
                            <i data-lucide="info" class="h-5 w-5 text-slate-400"></i> Información Básica
                        </h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Título del Producto *</label>
                                <input required type="text" name="title" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
                            </div>

                            <!-- Editor WYSIWYG -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Descripción *</label>
                                <div class="border border-slate-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500 transition-colors bg-white">
                                    <div class="bg-slate-50 border-b border-slate-300 p-1.5 flex flex-wrap gap-1 items-center">
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="bold" title="Negrita"><i data-lucide="bold" class="h-4 w-4"></i></button>
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="italic" title="Cursiva"><i data-lucide="italic" class="h-4 w-4"></i></button>
                                        <div class="w-px h-5 bg-slate-300 mx-1"></div>
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="formatBlock" data-value="H1" title="Título Principal"><i data-lucide="heading-1" class="h-4 w-4"></i></button>
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="formatBlock" data-value="H2" title="Subtítulo"><i data-lucide="heading-2" class="h-4 w-4"></i></button>
                                        <div class="w-px h-5 bg-slate-300 mx-1"></div>
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="insertUnorderedList" title="Lista de viñetas"><i data-lucide="list" class="h-4 w-4"></i></button>
                                        <button type="button" class="format-btn p-1.5 hover:bg-slate-200 rounded text-slate-700" data-command="insertOrderedList" title="Lista numerada"><i data-lucide="list-ordered" class="h-4 w-4"></i></button>
                                    </div>
                                    <div id="descriptionEditor" contenteditable="true" class="w-full min-h-[150px] max-h-[400px] overflow-y-auto p-4 outline-none text-sm" placeholder="Escribe la descripción aquí..."></div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Marca *</label>
                                    <input required type="text" name="brand" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">GTIN / SKU</label>
                                    <input type="text" name="gtin" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Barcode</label>
                                    <input type="text" name="barcode" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Enlaces e Imágenes -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 border-b pb-2">
                            <i data-lucide="link" class="h-5 w-5 text-slate-400"></i> Enlaces y Galería
                        </h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Enlace del Producto (URL) *</label>
                                <input required type="url" name="link" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Imagen Principal (URL) *</label>
                                <input required type="url" name="image_link" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>

                            <!-- Fotos opcionales -->
                            <div class="pt-2">
                                <p class="text-sm font-medium text-slate-700 mb-3">Imágenes Adicionales (Opcionales)</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div><input type="url" name="foto_1" placeholder="URL Foto 1" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><input type="url" name="foto_2" placeholder="URL Foto 2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><input type="url" name="foto_3" placeholder="URL Foto 3" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><input type="url" name="foto_4" placeholder="URL Foto 4" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><input type="url" name="foto_5" placeholder="URL Foto 5" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><input type="url" name="foto_6" placeholder="URL Foto 6" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                    <div class="sm:col-span-2"><input type="url" name="foto_7" placeholder="URL Foto 7" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Columna Lateral -->
                <div class="space-y-6">
                    
                    <!-- Precios -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 border-b pb-2">
                            <i data-lucide="dollar-sign" class="h-5 w-5 text-slate-400"></i> Precios
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Precio Normal *</label>
                                <input required type="number" step="0.01" name="price" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Precio Oferta (sale_price)</label>
                                <input type="number" step="0.01" name="sale_price" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Opcional">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Precio Descuento (discount_price)</label>
                                <input type="number" step="0.01" name="discount_price" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Opcional">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Precio Compra (purchase_price)</label>
                                <input type="number" step="0.01" name="purchase_price" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Opcional">
                            </div>
                        </div>
                    </div>

                    <!-- Inventario -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 border-b pb-2">
                            <i data-lucide="box" class="h-5 w-5 text-slate-400"></i> Inventario
                        </h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Disponibilidad *</label>
                                <select required name="availability" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white outline-none">
                                    <option value="in stock">En Stock</option>
                                    <option value="out of stock">Agotado</option>
                                    <option value="preorder">Pre-venta</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Condición *</label>
                                <select required name="condition" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white outline-none">
                                    <option value="new">Nuevo</option>
                                    <option value="refurbished">Reacondicionado</option>
                                    <option value="used">Usado</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Stock para Facebook *</label>
                                <input required type="number" min="0" name="quantity_to_sell_on_facebook" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej. 50">
                            </div>
                        </div>
                    </div>

                    <!-- Botón Enviar -->
                    <button type="submit" id="submitBtn" class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all disabled:opacity-70">
                        <i data-lucide="save" id="btnIcon" class="h-5 w-5"></i>
                        <span id="btnText">Guardar Producto</span>
                    </button>

                </div>
            </div>
        </form>
    </div>

    <!-- Script Principal Vainilla JS -->
    <script>
        // Iniciar Iconos
        lucide.createIcons();

        // Referencias al DOM
        const form = document.getElementById('productForm');
        const editor = document.getElementById('descriptionEditor');
        const formatBtns = document.querySelectorAll('.format-btn');
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // Lógica del Editor "Word"
        formatBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const command = btn.getAttribute('data-command');
                const value = btn.getAttribute('data-value') || null;
                document.execCommand(command, false, value);
                editor.focus();
            });
        });

        // Mostrar Alertas
        function showAlert(type, message) {
            alertBox.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200', 'bg-red-50', 'text-red-800', 'border-red-200');
            
            if (type === 'success') {
                alertBox.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
                alertIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                alertBox.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                alertIcon.setAttribute('data-lucide', 'alert-circle');
            }
            
            alertMessage.textContent = message;
            lucide.createIcons(); // Recargar icono
        }

        // Lógica de Envío
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validar que la descripción (HTML) no esté vacía
            if (!editor.innerHTML.trim()) {
                showAlert('error', 'La descripción no puede estar vacía.');
                return;
            }

            // Cambiar botón a estado cargando
            submitBtn.disabled = true;
            btnText.textContent = 'Guardando...';
            btnIcon.setAttribute('data-lucide', 'loader-2');
            btnIcon.classList.add('animate-spin');
            lucide.createIcons();

            // Recopilar datos del formulario
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.description = editor.innerHTML; // Añadir el HTML del editor

            try {
                // Hacer la petición a Netlify Functions
                const response = await fetch('/.netlify/functions/addProduct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Error al conectar con la base de datos o backend.');

                showAlert('success', '¡Producto guardado exitosamente en Neon!');
                form.reset(); // Limpiar inputs
                editor.innerHTML = ''; // Limpiar editor

            } catch (error) {
                showAlert('error', error.message || 'Error desconocido.');
            } finally {
                // Restaurar botón
                submitBtn.disabled = false;
                btnText.textContent = 'Guardar Producto';
                btnIcon.setAttribute('data-lucide', 'save');
                btnIcon.classList.remove('animate-spin');
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
