<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arelyshop.com - Página Principal</title>

    <!-- SEO and Social Sharing Meta Tags -->
    <meta name="description" content="Visita Arelyshop.com y descubre los mejores accesorios y gadgets de UGREEN | BASEUS | ANKER para hacer tu día más fácil.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arelyshop.com/">
    <meta property="og:title" content="Arelyshop.com - Página Principal">
    <meta property="og:description" content="Visita Arelyshop.com y descubre los mejores accesorios y gadgets de UGREEN | BASEUS | ANKER para hacer tu día más fácil.">
    <meta property="og:image" content="https://arelyshop.com/images/arelyshop-preview.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://arelyshop.com/">
    <meta name="twitter:title" content="Arelyshop.com - Página Principal">
    <meta name="twitter:description" content="Visita Arelyshop.com y descubre los mejores accesorios y gadgets de UGREEN | BASEUS | ANKER para hacer tu día más fácil.">
    <meta name="twitter:image" content="https://arelyshop.com/images/arelyshop-preview.webp">

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#111827',
                        secondary: '#f3f4f6',
                        accent: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos Fusionados (Nuevos + Existentes) */
        body { font-family: 'Inter', sans-serif; }
        .banner-carousel-container { overflow: hidden; position: relative; }
        .banner-carousel-track { display: flex; transition: transform 0.5s ease-in-out; }
        .banner-carousel-slide { min-width: 100%; box-sizing: border-box; }
        @keyframes cart-bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .cart-bounce-animation { animation: cart-bounce 0.5s ease; }
        .product-title { height: 2.5em; line-height: 1.25em; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-overflow: ellipsis; }
        .search-results-container::-webkit-scrollbar { width: 8px; }
        .search-results-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .search-results-container::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .search-results-container::-webkit-scrollbar-thumb:hover { background: #555; }
        .sold-out-watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); background-color: rgba(0, 0, 0, 0.7); color: white; font-weight: bold; padding: 6px 12px; font-size: 1rem; border-radius: 8px; z-index: 10; pointer-events: none; display: flex; align-items: center; gap: 0.375rem; white-space: nowrap; }
        .sold-out-watermark svg { width: 1em; height: 1em; }
        #sidenav, #cart-flyout { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidenav-overlay, #cart-overlay { transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Estilos personalizados menores para la transición del menú (Mantenidos) */
        .mobile-menu-active { transform: translateX(0%); }
        .mobile-menu-inactive { transform: translateX(-100%); }
        
        /* Clases para el Carrito Lateral (Side Cart) */
        .cart-active { transform: translateX(0%); }
        .cart-inactive { transform: translateX(100%); }
        
        /* Ocultar barra de desplazamiento en el top bar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Efecto spinner para carga de búsqueda */
        @keyframes spin-search { 100% { transform: rotate(360deg); } }
        .spin-anim { animation: spin-search 0.75s linear infinite; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans antialiased">
    
    <!-- EL TRUCO ESTÁ AQUÍ: class="contents" permite que el sticky del header.html funcione globalmente -->
    <div id="header-container" class="contents"></div>
    
    <!-- Contenido Principal de la página -->
    <main class="flex-grow bg-white">
        <!-- Contenedor Principal (Espacio superior reducido drásticamente) -->
        <div class="max-w-7xl mx-auto px-3 pt-4 pb-8 lg:px-4 lg:pt-6 lg:pb-12">
            
            <!-- Grilla de Categorías Destacadas (Fija a 2 columnas incluso en móvil) -->
            <div class="grid grid-cols-2 gap-3 md:gap-6 w-full">
                
                <!-- Columna Izquierda (2 tarjetas apiladas) -->
                <div class="flex flex-col gap-3 md:gap-6">
                    
                    <!-- Tarjeta 1: Hubs & Adaptadores -->
                    <a href="colecciones.html?category=Hubs%20%26%20Adaptadores" class="relative rounded-lg overflow-hidden group/promo block w-full h-[130px] sm:h-[180px] md:h-[250px] shadow-sm shadow-[#111827]/20">
                        <img src="images/hubs-promo.webp" alt="Promo Hubs y Adaptadores" class="absolute inset-0 w-full h-full object-cover transform group-hover/promo:scale-105 transition duration-700 z-0">
                        <!-- Sombra degradada para destacar el texto -->
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111827]/95 via-[#111827]/40 to-transparent opacity-80 group-hover/promo:opacity-100 transition-opacity duration-500 z-10"></div>
                        <div class="absolute inset-0 p-3 sm:p-4 md:p-6 flex flex-col justify-end text-white z-20">
                            <h4 class="text-sm sm:text-xl md:text-2xl font-bold mb-0.5 md:mb-1 drop-shadow-md leading-tight">Hubs & Adaptadores</h4>
                            <span class="text-[10px] sm:text-[13px] font-medium hover:underline inline-flex items-center gap-1 drop-shadow-md">Ver todo <i class="fa-solid fa-chevron-right text-[8px] md:text-[10px]"></i></span>
                        </div>
                    </a>

                    <!-- Tarjeta 2: Cables & Conectores -->
                    <a href="colecciones.html?category=Cables%20%26%20Conectores" class="relative rounded-lg overflow-hidden group/promo block w-full h-[130px] sm:h-[180px] md:h-[250px] shadow-sm shadow-[#111827]/20">
                        <img src="images/cables-promo.webp" alt="Promo Cables y Conectores" class="absolute inset-0 w-full h-full object-cover transform group-hover/promo:scale-105 transition duration-700 z-0">
                        <!-- Sombra degradada para destacar el texto -->
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111827]/95 via-[#111827]/40 to-transparent opacity-80 group-hover/promo:opacity-100 transition-opacity duration-500 z-10"></div>
                        <div class="absolute inset-0 p-3 sm:p-4 md:p-6 flex flex-col justify-end text-white z-20">
                            <h4 class="text-sm sm:text-xl md:text-2xl font-bold mb-0.5 md:mb-1 drop-shadow-md leading-tight">Cables & Conectores</h4>
                            <span class="text-[10px] sm:text-[13px] font-medium hover:underline inline-flex items-center gap-1 drop-shadow-md">Ver todo <i class="fa-solid fa-chevron-right text-[8px] md:text-[10px]"></i></span>
                        </div>
                    </a>

                </div>

                <!-- Columna Derecha (1 tarjeta grande) -->
                <div class="h-full">
                    
                    <!-- Tarjeta 3: Cargadores (Grande) -->
                    <a href="colecciones.html?category=Cargadores" class="relative rounded-lg overflow-hidden group/promo block w-full h-full shadow-sm shadow-[#111827]/20">
                        <img src="images/cargadores-promo.webp" alt="Promo Cargadores" class="absolute inset-0 w-full h-full object-cover transform group-hover/promo:scale-105 transition duration-700 z-0">
                        <!-- Sombra degradada para destacar el texto -->
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111827]/95 via-[#111827]/40 to-transparent opacity-80 group-hover/promo:opacity-100 transition-opacity duration-500 z-10"></div>
                        <div class="absolute inset-0 p-4 sm:p-6 md:p-8 flex flex-col justify-end text-white z-20">
                            <h4 class="text-lg sm:text-3xl md:text-4xl font-bold mb-1 md:mb-2 drop-shadow-md leading-tight">Cargadores</h4>
                            <span class="text-[11px] sm:text-[14px] md:text-base font-medium hover:underline inline-flex items-center gap-1 drop-shadow-md">Ver todo <i class="fa-solid fa-chevron-right text-[9px] md:text-[11px]"></i></span>
                        </div>
                    </a>

                </div>
            </div>

        </div>
    </main>
    
    <!-- Aquí se inyectará automáticamente el footer.html -->
    <div id="footer-container"></div>

    <!-- Script para cargar el Header, Footer y luego la lógica principal -->
    <script>
        // Cargar componentes dinámicamente (Ideal para GitHub + Netlify)
        Promise.all([
            fetch('header.html').then(res => res.text()),
            fetch('footer.html').then(res => res.text())
        ]).then(([headerHtml, footerHtml]) => {
            // 1. Inyectar el HTML
            document.getElementById('header-container').innerHTML = headerHtml;
            document.getElementById('footer-container').innerHTML = footerHtml;
            
            // 2. Cargar main.js DESPUÉS de que el DOM esté listo y el header exista
            const script = document.createElement('script');
            script.src = 'js/main.js';
            document.body.appendChild(script);
        }).catch(err => console.error('Error cargando componentes:', err));
    </script>
</body>
</html>
