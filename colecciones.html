    <!-- Lógica del Catálogo Dinámico -->
    <script>
        // Cargar Header y Footer globales
        Promise.all([
            fetch('header.html').then(res => res.text()),
            fetch('footer.html').then(res => res.text())
        ]).then(([headerHtml, footerHtml]) => {
            document.getElementById('header-container').innerHTML = headerHtml;
            document.getElementById('footer-container').innerHTML = footerHtml;
            
            const script = document.createElement('script');
            script.src = 'js/main.js';
            document.body.appendChild(script);
        }).catch(err => console.error('Error cargando componentes:', err));

        // --- LÓGICA DE DATOS DESDE NEON ---
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        const itemsPerPage = 24; // Cantidad de productos a cargar por bloque

        async function initColecciones() {
            try {
                // 1. LEER PARÁMETROS DE LA URL
                const urlParams = new URLSearchParams(window.location.search);
                const searchQuery = urlParams.get('search');
                const categoryQuery = urlParams.get('category');
                const brandQuery = urlParams.get('brand'); // Por si luego enlazas marcas
                const ofertasQuery = urlParams.get('ofertas');

                // 2. CONSTRUIR URL DEL BACKEND DINÁMICAMENTE
                let apiUrl = '/.netlify/functions/get_tienda?limit=5000'; // 5000 para cargar todo el filtro a la vez y paginar localmente

                if (searchQuery) {
                    apiUrl += `&search=${encodeURIComponent(searchQuery)}`;
                    // Modificar textos de la página
                    document.title = `Resultados para "${searchQuery}" - Arelyshop.com`;
                    document.getElementById('page-title').textContent = `Resultados para "${searchQuery}"`;
                    document.getElementById('page-subtitle').textContent = `Hemos encontrado estos productos que coinciden con tu búsqueda.`;
                    document.getElementById('breadcrumb-current').textContent = `Búsqueda: ${searchQuery}`;
                } else if (categoryQuery) {
                    apiUrl += `&category=${encodeURIComponent(categoryQuery)}`;
                    document.title = `${categoryQuery} - Arelyshop.com`;
                    document.getElementById('page-title').textContent = categoryQuery;
                    document.getElementById('page-subtitle').textContent = `Explora nuestra colección de ${categoryQuery.toLowerCase()}.`;
                    document.getElementById('breadcrumb-current').textContent = categoryQuery;
                } else if (brandQuery) {
                    apiUrl += `&brand=${encodeURIComponent(brandQuery)}`;
                    document.title = `${brandQuery} - Arelyshop.com`;
                    document.getElementById('page-title').textContent = `Productos ${brandQuery}`;
                    document.getElementById('page-subtitle').textContent = `Todo el catálogo de la marca ${brandQuery}.`;
                    document.getElementById('breadcrumb-current').textContent = brandQuery;
                } else if (ofertasQuery === 'true') {
                    // Personalizar el título y textos para las ofertas
                    document.title = `Ofertas Especiales - Arelyshop.com`;
                    document.getElementById('page-title').textContent = `Ofertas Especiales`;
                    document.getElementById('page-subtitle').textContent = `Aprovecha nuestros productos con descuentos increíbles por tiempo limitado.`;
                    document.getElementById('breadcrumb-current').textContent = `Ofertas`;
                }

                // 3. HACER LA PETICIÓN AL BACKEND
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Error al conectar con la base de datos');
                
                allProducts = await response.json();
                
                // 3.5 FILTRAR OFERTAS (si aplica)
                if (ofertasQuery === 'true') {
                    allProducts = allProducts.filter(item => {
                        const price = parseFloat(item.price) || 0;
                        const salePrice = parseFloat(item.sale_price) || price;
                        return price > salePrice; // Solo conservamos productos que realmente tienen descuento
                    });
                }
                
                // ORDEN POR DEFECTO: Los más nuevos primero (ID descendente)
                // Solo lo aplicamos si NO es una búsqueda, para no arruinar la prioridad del backend
                if (!searchQuery) {
                    allProducts.sort((a, b) => b.id - a.id);
                }

                // REGLA GLOBAL: Empujar siempre los productos agotados al final en la carga inicial
                allProducts.sort((a, b) => {
                    const aOut = (a.availability || '').trim().toLowerCase() === 'out of stock' ? 1 : 0;
                    const bOut = (b.availability || '').trim().toLowerCase() === 'out of stock' ? 1 : 0;
                    return aOut - bOut;
                });

                filteredProducts = [...allProducts];

                buildFilters();
                renderProducts();

            } catch (error) {
                console.error("Error cargando productos:", error);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full py-20 text-center text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
                        <p>No se pudo cargar el catálogo en este momento. Inténtalo más tarde.</p>
                    </div>`;
            }
        }

        // Renderiza el Grid de Productos (con soporte para agregar más)
        function renderProducts(append = false) {
            const grid = document.getElementById('product-grid');
            const loadMoreBtn = document.getElementById('load-more-container');
            const endCatalogTxt = document.getElementById('end-of-catalog');

            if (!append) {
                grid.innerHTML = ''; // Limpiamos el grid si cambiamos filtros u orden
                currentPage = 1;
            }

            if (filteredProducts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center text-gray-500">
                        <i class="fa-solid fa-box-open text-4xl mb-4 text-gray-300"></i>
                        <p>No se encontraron resultados con tu búsqueda.</p>
                        <button onclick="window.location.href='colecciones.html'" class="mt-4 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-black rounded text-sm font-medium transition">Ver todo el catálogo</button>
                    </div>`;
                document.getElementById('product-count-text').textContent = '0 productos';
                loadMoreBtn.classList.add('hidden');
                endCatalogTxt.classList.add('hidden');
                return;
            }

            // Calculamos qué parte del array debemos mostrar
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const productsToShow = filteredProducts.slice(startIndex, endIndex);

            // Variable para agrupar todo el HTML y no saturar el navegador dibujando 1 por 1
            let newHtml = '';

            productsToShow.forEach((item, index) => {
                const price = parseFloat(item.price) || 0;
                const salePrice = parseFloat(item.sale_price) || price;
                const isOutOfStock = (item.availability || '').trim().toLowerCase() === 'out of stock';
                
                let badgeHtml = '';
                let priceHtml = '';
                let imageClasses = 'product-img w-full h-full object-cover transition-transform duration-700';
                
                const imageLink = item.image_link || 'https://placehold.co/400x400?text=No+Image';

                // TRUCO DE VELOCIDAD: Los primeros 6 productos de la 1ra página cargan inmediatamente (eager). 
                // El resto carga diferido (lazy) para ahorrar datos.
                const isPriority = currentPage === 1 && index < 6;
                const loadingAttr = isPriority ? 'eager' : 'lazy';
                const fetchPriority = isPriority ? 'high' : 'auto';

                // Lógica de visualización (Precios ajustados para móvil y etiquetas con font-bold)
                if (isOutOfStock) {
                    badgeHtml = `<span class="absolute bottom-2 left-2 bg-[#111827] text-white text-[10px] sm:text-xs font-bold px-2 py-1 sm:px-2.5 sm:py-1.5 uppercase rounded z-10 shadow-sm flex items-center gap-1"><i class="fa-solid fa-ban"></i> Agotado</span>`;
                    imageClasses += ' grayscale opacity-50';
                    // Precio ajustado a 14px en móvil
                    priceHtml = `<span class="font-semibold text-[14px] sm:text-lg lg:text-xl text-gray-500 leading-none">Bs. ${salePrice.toFixed(2)}</span>`;
                } else {
                    if (price > salePrice) {
                        badgeHtml = `<span class="absolute bottom-2 left-2 bg-gradient-to-r from-red-500 to-yellow-400 text-white text-[10px] sm:text-xs font-bold px-2 py-1 sm:px-2.5 sm:py-1.5 uppercase rounded z-10 shadow-sm flex items-center gap-1"><i class="fa-solid fa-fire"></i> Oferta</span>`;
                        priceHtml = `
                            <span class="font-semibold text-[14px] sm:text-lg lg:text-xl text-red-600 leading-none">Bs. ${salePrice.toFixed(2)}</span>
                            <span class="text-gray-400 line-through text-[11px] sm:text-[14px] leading-none">Bs. ${price.toFixed(2)}</span>
                        `;
                    } else {
                        // Precio ajustado a 14px en móvil
                        priceHtml = `<span class="font-semibold text-[14px] sm:text-lg lg:text-xl text-gray-900 leading-none">Bs. ${salePrice.toFixed(2)}</span>`;
                    }
                }

                // También he aplicado la mejora del interlineado compacto (leading-[1.1] y márgenes reducidos)
                newHtml += `
                <a href="producto.html?id=${item.id}" class="product-card group relative flex flex-col cursor-pointer bg-white rounded-lg shadow-[0_4px_20px_-4px_rgba(0,0,0,0.06)] hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.12)] border border-gray-200 hover:border-gray-300 transition-all duration-300 overflow-hidden">
                    <div class="relative bg-gray-100 aspect-square overflow-hidden">
                        ${badgeHtml}
                        <img src="${imageLink}" loading="${loadingAttr}" fetchpriority="${fetchPriority}" decoding="async" alt="${item.title}" class="${imageClasses}">
                    </div>
                    <div class="flex flex-col flex-1 p-3 pt-2">
                        <h3 class="text-[14px] sm:text-base font-semibold leading-[1.1] text-gray-800 group-hover:text-blue-600 transition-colors line-clamp-2 mb-0.5">${item.title}</h3>
                        <p class="text-gray-500 text-[12px] sm:text-[13px] mb-1.5 line-clamp-1">${item.category || item.brand || 'Varios'}</p>
                        <div class="mt-auto flex items-center gap-1.5">
                            ${priceHtml}
                        </div>
                    </div>
                </a>`;
            });

            // Inyectamos todo el HTML de golpe (Ultra rápido)
            if (append) {
                grid.insertAdjacentHTML('beforeend', newHtml);
            } else {
                grid.innerHTML = newHtml;
            }

            const shownCount = Math.min(endIndex, filteredProducts.length);
            document.getElementById('product-count-text').textContent = `Mostrando ${shownCount} de ${filteredProducts.length} productos`;

            if (endIndex < filteredProducts.length) {
                loadMoreBtn.classList.remove('hidden');
                endCatalogTxt.classList.add('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
                endCatalogTxt.classList.remove('hidden');
            }
        }

        function loadMoreProducts() {
            currentPage++;
            renderProducts(true);
        }

        // Construye las listas de filtros en el Sidebar agrupando correctamente sin importar mayúsculas o espacios
        function buildFilters() {
            // 1. Filtro Disponibilidad
            const inStock = allProducts.filter(p => (p.availability || '').trim().toLowerCase() === 'in stock').length;
            const outOfStock = allProducts.filter(p => (p.availability || '').trim().toLowerCase() === 'out of stock').length;

            document.getElementById('filter-availability').innerHTML = `
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="stock-in" value="in stock" class="filter-checkbox filter-stock w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900">
                    <label for="stock-in" class="cursor-pointer hover:text-gray-900 flex-1">En stock</label>
                    <span class="text-gray-400 text-[12px]">(${inStock})</span>
                </li>
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="stock-out" value="out of stock" class="filter-checkbox filter-stock w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900">
                    <label for="stock-out" class="cursor-pointer hover:text-gray-900 flex-1">Agotado</label>
                    <span class="text-gray-400 text-[12px]">(${outOfStock})</span>
                </li>
            `;

            // 2. Filtro Categorías (Agrupado inteligentemente)
            const catMap = new Map();
            allProducts.forEach(p => {
                const raw = (p.category || '').trim();
                if (raw) {
                    const key = raw.toLowerCase();
                    if (!catMap.has(key)) catMap.set(key, { name: raw, count: 0 });
                    catMap.get(key).count++;
                }
            });
            
            let catHtml = '';
            let idx = 0;
            catMap.forEach((data) => {
                const safeValue = data.name.replace(/"/g, '&quot;');
                catHtml += `
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="cat-${idx}" value="${safeValue}" class="filter-checkbox filter-cat w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900">
                    <label for="cat-${idx}" class="cursor-pointer hover:text-gray-900 flex-1 line-clamp-1">${data.name}</label>
                    <span class="text-gray-400 text-[12px]">(${data.count})</span>
                </li>`;
                idx++;
            });
            document.getElementById('filter-category').innerHTML = catHtml || '<li class="text-xs text-gray-400">Sin categorías</li>';

            // 3. Filtro Marcas (Agrupado inteligentemente)
            const brandMap = new Map();
            allProducts.forEach(p => {
                const raw = (p.brand || '').trim();
                if (raw) {
                    const key = raw.toLowerCase();
                    if (!brandMap.has(key)) brandMap.set(key, { name: raw, count: 0 });
                    brandMap.get(key).count++;
                }
            });
            
            let brandHtml = '';
            idx = 0;
            brandMap.forEach((data) => {
                const safeValue = data.name.replace(/"/g, '&quot;');
                brandHtml += `
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="brand-${idx}" value="${safeValue}" class="filter-checkbox filter-brand w-4 h-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900">
                    <label for="brand-${idx}" class="cursor-pointer hover:text-gray-900 flex-1 line-clamp-1">${data.name}</label>
                    <span class="text-gray-400 text-[12px]">(${data.count})</span>
                </li>`;
                idx++;
            });
            document.getElementById('filter-brand').innerHTML = brandHtml || '<li class="text-xs text-gray-400">Sin marcas</li>';

            // Asignar eventos de escucha a los checkboxes creados
            document.querySelectorAll('.filter-checkbox').forEach(cb => {
                cb.addEventListener('change', applyFilters);
            });
        }

        // Aplica lógica de filtrado de manera robusta y estricta
        function applyFilters() {
            // Normalizamos los valores seleccionados a minúsculas para evitar fallos de coincidencia
            const checkedStock = Array.from(document.querySelectorAll('.filter-stock:checked')).map(cb => cb.value.trim().toLowerCase());
            const checkedCats = Array.from(document.querySelectorAll('.filter-cat:checked')).map(cb => cb.value.trim().toLowerCase());
            const checkedBrands = Array.from(document.querySelectorAll('.filter-brand:checked')).map(cb => cb.value.trim().toLowerCase());
            
            const mobileStockOnly = document.getElementById('mobile-stock-only').checked;

            filteredProducts = allProducts.filter(p => {
                // Normalizamos los datos de la base de datos al vuelo
                const pStock = (p.availability || '').trim().toLowerCase();
                const pCat = (p.category || '').trim().toLowerCase();
                const pBrand = (p.brand || '').trim().toLowerCase();
                
                // 1. Condición de Disponibilidad
                let availMatch = checkedStock.length === 0 || checkedStock.includes(pStock);
                if (mobileStockOnly && pStock !== 'in stock') availMatch = false;

                // 2. Condición de Categoría
                const catMatch = checkedCats.length === 0 || checkedCats.includes(pCat);
                
                // 3. Condición de Marca
                const brandMatch = checkedBrands.length === 0 || checkedBrands.includes(pBrand);

                // El producto DEBE CUMPLIR las 3 condiciones a la vez (Comportamiento AND)
                return availMatch && catMatch && brandMatch;
            });

            applySorting();
        }

        // Sistema de Ordenamiento
        function applySorting() {
            const sortVal = document.getElementById('sort-select').value;
            
            filteredProducts.sort((a,b) => {
                // 1. Evaluar estado de stock
                const aOut = (a.availability || '').trim().toLowerCase() === 'out of stock' ? 1 : 0;
                const bOut = (b.availability || '').trim().toLowerCase() === 'out of stock' ? 1 : 0;
                
                // Prioridad máxima: Agotados al final
                if (aOut !== bOut) {
                    return aOut - bOut;
                }

                // 2. Si tienen el mismo estado de stock, aplicar el filtro seleccionado
                if (sortVal === 'asc') {
                    return (parseFloat(a.sale_price) || parseFloat(a.price) || 0) - (parseFloat(b.sale_price) || parseFloat(b.price) || 0);
                } else if (sortVal === 'desc') {
                    return (parseFloat(b.sale_price) || parseFloat(b.price) || 0) - (parseFloat(a.sale_price) || parseFloat(a.price) || 0);
                } else {
                    // Restaurar el orden original base (mantiene los más nuevos primero o la prioridad de búsqueda intacta)
                    return allProducts.indexOf(a) - allProducts.indexOf(b);
                }
            });
            
            currentPage = 1;
            renderProducts();
        }

        // Botón limpiar todo
        function resetFilters() {
            document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('mobile-stock-only').checked = false;
            document.getElementById('sort-select').value = 'default';
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // OJO: Ya no inicializamos el carrito localmente en este archivo, 
            // ya que está delegado a main.js de forma global
            initColecciones();

            document.getElementById('sort-select').addEventListener('change', applySorting);
            document.getElementById('mobile-stock-only').addEventListener('change', applyFilters);
        });

    </script>
</body>
