<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Producto... - ARELYSHOP.COM</title>

    <!-- Importar fuente Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Usamos Tailwind CSS para emular el diseño de manera rápida y limpia -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#111827',
                        secondary: '#f3f4f6',
                        accent: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos base heredados */
        .mobile-menu-active { transform: translateX(0%); }
        .mobile-menu-inactive { transform: translateX(-100%); }
        .cart-active { transform: translateX(0%); }
        .cart-inactive { transform: translateX(100%); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin-search { 100% { transform: rotate(360deg); } }
        .spin-anim { animation: spin-search 0.75s linear infinite; }
        
        /* Estilos de Producto */
        .thumb-active { border-color: #111827 !important; opacity: 1 !important; }
        
        /* Efecto Hover para tarjetas (Importado de colecciones) */
        .product-card:hover .product-img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans antialiased">
    <!-- Inyección automática del Header -->
    <div id="header-container"></div>
    
    <!-- Contenido Principal: Página de Producto -->
    <main class="max-w-7xl mx-auto px-4 py-3 lg:py-4">
        
        <!-- Migas de pan (Breadcrumbs) -->
        <nav class="text-[13px] text-gray-500 mb-4 lg:mb-6 flex items-center gap-2">
            <a href="index.html" class="hover:text-black hover:underline">Inicio</a>
            <i class="fa-solid fa-chevron-right text-[9px]"></i>
            <a href="colecciones.html" class="hover:text-black hover:underline">Catálogo</a>
            <i class="fa-solid fa-chevron-right text-[9px]"></i>
            <span id="br-title" class="text-gray-900 font-medium line-clamp-1">Cargando...</span>
        </nav>
        
        <!-- Layout del Producto -->
        <div class="flex flex-col lg:flex-row gap-10 lg:gap-16 lg:items-start">
            
            <!-- 1. GALERÍA DE IMÁGENES -->
            <div class="w-full lg:w-1/2 lg:sticky lg:top-6 lg:z-10">
                <!-- Imagen Principal -->
                <div id="main-image-container" class="relative bg-gray-100 rounded-lg shadow-md overflow-hidden aspect-square mb-4 group cursor-zoom-in" onclick="openLightbox(event)">
                    <!-- Pista del carrusel (Contiene todas las imágenes alineadas horizontalmente) -->
                    <div id="carousel-track" class="flex w-full h-full transition-transform duration-500 ease-out" style="transform: translateX(0%);">
                        <!-- Las imágenes se insertan aquí dinámicamente vía JS -->
                    </div>
                    
                    <!-- Flecha Izquierda -->
                    <button onclick="navigateMainImage(event, -1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-gray-800 shadow-md rounded-full w-9 h-9 flex items-center justify-center z-20 transition">
                        <i class="fa-solid fa-chevron-left text-[13px]"></i>
                    </button>
                    <!-- Flecha Derecha -->
                    <button onclick="navigateMainImage(event, 1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-gray-800 shadow-md rounded-full w-9 h-9 flex items-center justify-center z-20 transition">
                        <i class="fa-solid fa-chevron-right text-[13px]"></i>
                    </button>
                    <!-- Icono flotante indicador de zoom -->
                    <div class="absolute bottom-4 right-4 bg-white/90 text-black w-10 h-10 rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                        <i class="fa-solid fa-expand"></i>
                    </div>
                </div>
                
                <!-- Miniaturas (Thumbnails) inyectadas desde Neon -->
                <div class="relative">
                    <div id="thumbnails-container" class="flex lg:grid lg:grid-cols-4 gap-3 overflow-x-auto lg:overflow-visible hide-scrollbar scroll-smooth snap-x lg:snap-none">
                        <!-- Las miniaturas se insertan aquí vía JS -->
                    </div>
                </div>
            </div>
            
            <!-- 2. INFORMACIÓN DEL PRODUCTO -->
            <div class="w-full lg:w-1/2 flex flex-col">
                
                <!-- Título -->
                <h1 id="prod-title" class="text-lg lg:text-xl font-bold tracking-tight text-gray-900 mb-2 leading-tight">
                    Cargando producto...
                </h1>
                
                <!-- Marca, SKU y Estrellas -->
                <div class="flex items-center gap-2 sm:gap-3 mb-5 text-[12px] sm:text-[13px] text-gray-500 whitespace-nowrap">
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="font-medium text-gray-800">Marca:</span> 
                        <span id="prod-brand" class="bg-[#111827] text-white px-2 py-0.5 rounded text-[11px] sm:text-[12px] font-semibold tracking-wide">...</span>
                    </div>
                    <div class="w-1 h-1 bg-gray-300 rounded-full shrink-0"></div>
                    <div class="flex items-center gap-1 shrink-0">
                        <span class="font-medium text-gray-800">SKU:</span> 
                        <span id="prod-sku" class="uppercase">...</span>
                    </div>
                    <div class="w-1 h-1 bg-gray-300 rounded-full shrink-0"></div>
                    <!-- 5 Estrellas Amarillas -->
                    <div class="flex items-center gap-0.5 text-yellow-400 text-[11px] sm:text-[12px] shrink-0">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                </div>
                
                <!-- Precio -->
                <div class="flex items-end gap-3 mb-4 lg:mb-6">
                    <span id="prod-sale-price" class="text-2xl font-semibold text-gray-900">Bs. 0.00</span>
                    <span id="prod-price" class="text-base text-gray-400 line-through mb-0.5 hidden">Bs. 0.00</span>
                    <span id="prod-savings" class="text-[12px] font-bold text-white bg-gradient-to-r from-red-500 to-yellow-500 px-2 py-0.5 rounded mb-1 hidden shadow-sm">Ahorras Bs. 0.00</span>
                </div>
                
                <!-- Barra de Urgencia / Stock -->
                <div id="stock-container" class="bg-gray-50 border border-gray-100 p-3 sm:p-4 rounded-lg mb-5 lg:mb-8 hidden">
                    <p class="text-[14px] text-gray-800 mb-2 font-medium"><i class="fa-solid fa-fire text-orange-500 mr-1"></i> ¡Date prisa! Solo quedan <strong id="prod-stock">0</strong> artículos en stock.</p>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="stock-bar-fill" class="bg-gradient-to-r from-red-500 to-yellow-400 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Controles de Compra Dinámicos -->
                <div id="product-actions-container">
                    
                    <!-- BOTONES IN STOCK -->
                    <div id="in-stock-buttons" class="hidden flex-col">
                        <div class="flex flex-row gap-3 mb-3 lg:mb-4">
                            <!-- Selector de Cantidad -->
                            <div class="flex items-center border border-gray-300 rounded-lg h-12 w-28 sm:w-32 bg-white flex-shrink-0">
                                <button onclick="updateQty(-1)" class="w-10 h-full flex justify-center items-center text-gray-500 hover:text-black hover:bg-gray-50 transition"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="number" id="qty-input" value="1" min="1" class="flex-1 h-full text-center text-[15px] font-bold border-none focus:ring-0 p-0 m-0 w-full bg-transparent">
                                <button onclick="updateQty(1)" class="w-10 h-full flex justify-center items-center text-gray-500 hover:text-black hover:bg-gray-50 transition"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                            
                            <!-- Botón Añadir al Carrito -->
                            <button id="add-to-cart-btn" class="flex-1 bg-[#111827] text-white border border-[#111827] h-12 rounded-lg font-bold hover:bg-[#1f2937] transition flex items-center justify-center gap-2 text-[14px] sm:text-base">
                                <svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px" fill="currentColor"><path d="M440-600v-120H320v-80h120v-120h80v120h120v80H520v120h-80ZM223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/></svg>
                                Añadir al carrito
                            </button>
                        </div>
                        
                        <!-- Botón Compra Dinámica (Comprar Ahora -> WhatsApp) -->
                        <button id="buy-now-whatsapp" data-name="" data-sku="" data-price="" class="w-full bg-[#25d366] hover:bg-[#22bf5b] text-white h-12 rounded-lg font-bold transition-all shadow-lg mb-5 lg:mb-8 flex items-center justify-center gap-2">
                            <i class="fa-brands fa-whatsapp text-xl"></i> ¡Pídelo por WhatsApp!
                        </button>
                    </div>
                    
                    <!-- BOTÓN OUT OF STOCK -->
                    <button id="out-of-stock-btn" class="hidden w-full bg-gray-400 text-white h-12 rounded-lg font-bold cursor-not-allowed mb-5 lg:mb-8 flex items-center justify-center gap-2 transition" disabled>
                        <i class="fa-solid fa-ban text-lg"></i> Agotado
                    </button>
                </div>
                
                <!-- Bloque de Confianza (Trustbadges) -->
                <div class="flex items-center justify-center gap-6 py-4 border-t border-b border-gray-100 mb-8 text-gray-500 text-[13px]">
                    <div class="flex flex-col items-center gap-1"><i class="fa-solid fa-shield-halved text-xl"></i> Pago Seguro</div>
                    <div class="flex flex-col items-center gap-1"><i class="fa-solid fa-truck-fast text-xl"></i> Envío rápido</div>
                    <div class="flex flex-col items-center gap-1"><i class="fa-solid fa-rotate-left text-xl"></i> 30 Días Devolución</div>
                </div>
                
                <!-- Descripción Completa -->
                <div class="text-[16px] text-gray-600 leading-snug">
                    <h2 class="text-xl font-bold text-gray-900 mb-3">Descripción:</h2>
                    <div id="prod-desc">
                        <!-- Descripción inyectada desde base de datos -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- SECCIÓN: PRODUCTOS COMPLEMENTARIOS (Estilo Colecciones + Carrusel móvil) -->
        <section class="mt-8 lg:mt-24 pt-8 lg:pt-10 border-t border-gray-200">
            <h2 class="text-[20px] sm:text-2xl font-bold text-gray-900 mb-6 sm:mb-8 flex items-center justify-center gap-1.5 sm:gap-3 text-center whitespace-nowrap tracking-tight">
                <i class="fa-solid fa-heart text-red-500 text-[18px] sm:text-[20px]"></i> 
                ¡Otros clientes también vieron!
                <i class="fa-solid fa-heart text-red-500 text-[18px] sm:text-[20px]"></i>
            </h2>
            
            <!-- Carrusel en Móvil / Grilla en Desktop -->
            <div id="related-products-grid" class="flex md:grid md:grid-cols-4 gap-4 sm:gap-6 overflow-x-auto md:overflow-visible pb-4 hide-scrollbar snap-x snap-mandatory">
                <!-- Upsells inyectados desde base de datos -->
            </div>
        </section>
    </main>
    
    <!-- Inyección automática del Footer -->
    <div id="footer-container"></div>
    
    <!-- MODAL LIGHTBOX DE GALERÍA -->
    <div id="lightbox" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300 touch-none" onclick="if(event.target === this) closeLightbox()">
        <!-- Botón Cerrar -->
        <button onclick="closeLightbox()" class="absolute top-4 right-4 sm:top-8 sm:right-8 w-10 h-10 sm:w-12 sm:h-12 bg-white border border-gray-200 text-black hover:bg-gray-100 rounded-full flex items-center justify-center text-xl z-50 shadow-sm transition"><i class="fa-solid fa-xmark"></i></button>
        
        <!-- Navegación Izquierda -->
        <button onclick="navigateLightbox(-1); event.stopPropagation();" class="absolute left-2 sm:left-10 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 bg-white border border-gray-200 text-black hover:bg-gray-100 rounded-full flex items-center justify-center text-xl z-50 shadow-sm transition"><i class="fa-solid fa-chevron-left"></i></button>
        
        <!-- Contenedor Imagen Zoom (Ahora con carrusel interno) -->
        <div id="lightbox-track-container" class="relative w-full max-w-6xl h-[80vh] flex items-center justify-center overflow-hidden group" onclick="if(event.target === this || event.target.id === 'lightbox-track' || event.target.classList.contains('lb-slide-wrapper')) closeLightbox()">
            
            <!-- Pista del carrusel para el Lightbox -->
            <div id="lightbox-track" class="flex w-full h-full transition-transform duration-500 ease-out items-center" style="transform: translateX(0%);">
                <!-- Se inyectan las imágenes por JS -->
            </div>
            
            <!-- Hint overlay (Desaparece al hacer zoom o al salir el hover) -->
            <div id="zoom-hint" class="absolute bottom-8 bg-black/80 text-white px-5 py-2.5 rounded-full text-sm font-medium tracking-wide opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none shadow-lg z-30">
                <i class="fa-solid fa-magnifying-glass-plus mr-2"></i> Haz clic en la imagen para ampliar
            </div>
        </div>
        
        <!-- Navegación Derecha -->
        <button onclick="navigateLightbox(1); event.stopPropagation();" class="absolute right-2 sm:right-10 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 bg-white border border-gray-200 text-black hover:bg-gray-100 rounded-full flex items-center justify-center text-xl z-50 shadow-sm transition"><i class="fa-solid fa-chevron-right"></i></button>
        
        <!-- Contador de fotos -->
        <div class="absolute bottom-6 font-bold text-gray-800 text-sm tracking-widest uppercase bg-white px-4 py-1.5 rounded-full shadow-sm border border-gray-200 pointer-events-none z-50">
            <span id="lightbox-counter">1</span> / <span id="lightbox-counter-total">1</span>
        </div>
    </div>
    
    <!-- Script principal de la página -->
    <script>
        // Cargar Header y Footer globales
        Promise.all([
            fetch('header.html').then(res => res.text()),
            fetch('footer.html').then(res => res.text())
        ]).then(([headerHtml, footerHtml]) => {
            document.getElementById('header-container').innerHTML = headerHtml;
            document.getElementById('footer-container').innerHTML = footerHtml;
            
            const script = document.createElement('script');
            script.src = 'js/main.js';
            document.body.appendChild(script);
        }).catch(err => console.error('Error cargando componentes:', err));

        // --- LÓGICA DE DATOS DINÁMICOS DESDE NEON ---
        let galleryImages = [];
        let currentImageIndex = 0;
        let isZoomed = false;

        // 1. Cargar producto principal por ID
        async function fetchProductData() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id') || '1'; // Default ID 1 si no hay URL
            
            try {
                const response = await fetch(`/.netlify/functions/get_tienda?id=${productId}`);
                if (!response.ok) throw new Error('Producto no encontrado');
                return await response.json();
            } catch (error) {
                console.error("Error al cargar el producto:", error);
                document.getElementById('prod-title').textContent = "Producto no disponible";
                return null;
            }
        }

        // 2. Cargar sugerencias
        async function fetchRelatedProducts(brand, category, currentId) {
            try {
                // Pasamos brand, category y el ID actual. Pedimos 20 para poder mezclarlos
                const safeId = currentId ? currentId : '';
                const url = `/.netlify/functions/get_tienda?brand=${encodeURIComponent(brand || '')}&category=${encodeURIComponent(category || '')}&exclude_id=${safeId}&limit=20`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error cargando relacionados');
                return await response.json();
            } catch (error) {
                console.error("Error al cargar relacionados:", error);
                return [];
            }
        }

        // 3. Inicializador
        async function initProductPage() {
            const product = await fetchProductData();
            if (!product) return;

            // Procesamiento de campos
            const price = parseFloat(product.price) || 0;
            const salePrice = parseFloat(product.sale_price) || price;
            const stockQty = parseInt(product.quantity_to_sell_on_facebook) || 0;
            const availability = (product.availability || '').trim().toLowerCase();

            // Textos básicos
            document.title = `${product.title} - ARELYSHOP.COM`;
            document.getElementById('br-title').textContent = product.title;
            document.getElementById('prod-title').textContent = product.title;
            document.getElementById('prod-brand').textContent = product.brand || 'N/A';
            document.getElementById('prod-sku').textContent = product.gtin || 'N/A';
            
            // Formateo de descripción: Negritas entre ** o * y saltos de línea
            let rawDesc = product.description || '';
            let formattedDesc = rawDesc
                .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-gray-900">$1</strong>') // Detecta formato **texto**
                .replace(/\*([^*]+)\*/g, '<strong class="font-bold text-gray-900">$1</strong>')     // Detecta formato *texto*
                .replace(/\n/g, '<br>');
            document.getElementById('prod-desc').innerHTML = formattedDesc;

            // Precios
            document.getElementById('prod-sale-price').textContent = `Bs. ${salePrice.toFixed(2)}`;
            if (price > salePrice) {
                document.getElementById('prod-price').textContent = `Bs. ${price.toFixed(2)}`;
                document.getElementById('prod-price').classList.remove('hidden');
                
                const savings = price - salePrice;
                document.getElementById('prod-savings').textContent = `Ahorras Bs. ${savings.toFixed(2)}`;
                document.getElementById('prod-savings').classList.remove('hidden');
            }

            // Barra de Stock
            if (stockQty > 0) {
                document.getElementById('stock-container').classList.remove('hidden');
                document.getElementById('prod-stock').textContent = stockQty;
                // Calculamos porcentaje visual de urgencia (15 de límite para que se vea la barra moverse)
                const percentage = Math.min((stockQty / 15) * 100, 100);
                document.getElementById('stock-bar-fill').style.width = `${percentage}%`;
            }

            // Disponibilidad (Botones In Stock vs Agotado)
            if (availability === 'in stock') {
                document.getElementById('in-stock-buttons').classList.remove('hidden');
                document.getElementById('in-stock-buttons').classList.add('flex');
                
                // Setear dataset para WhatsApp asegurando el ID
                const whatsappBtn = document.getElementById('buy-now-whatsapp');
                whatsappBtn.dataset.name = product.title;
                whatsappBtn.dataset.sku = product.gtin || '';
                whatsappBtn.dataset.price = salePrice;
                whatsappBtn.dataset.id = product.id; // <-- Guardamos el ID exacto de la base de datos

                // Conectar Botón de Añadir al carrito a la lógica de main.js
                const addToCartBtn = document.getElementById('add-to-cart-btn');
                if (addToCartBtn) {
                    addToCartBtn.onclick = () => {
                        const qtyInput = document.getElementById('qty-input');
                        const qty = parseInt(qtyInput ? qtyInput.value : 1);
                        
                        // Armar el objeto con la estructura que espera tu carrito en main.js
                        const cartProduct = {
                            id: product.id,
                            title: product.title,
                            gtin: product.gtin || '',
                            price: salePrice,
                            image_link: product.image_link || ''
                        };
                        
                        // Llamar a la función global de main.js
                        if (window.addToCart) {
                            window.addToCart(cartProduct, qty);
                        }
                    };
                }
            } else {
                document.getElementById('out-of-stock-btn').classList.remove('hidden');
                document.getElementById('out-of-stock-btn').classList.add('flex');
            }

            // Mapeo Dinámico de Imágenes (image_link + foto_1 a foto_7)
            const photoFields = ['image_link', 'foto_1', 'foto_2', 'foto_3', 'foto_4', 'foto_5', 'foto_6', 'foto_7'];
            galleryImages = photoFields.map(f => product[f]).filter(img => img && img.trim() !== '');
            
            if (galleryImages.length > 0) {
                // 1. Llenamos las pistas de los carruseles (Principal y Lightbox)
                const track = document.getElementById('carousel-track');
                const lbTrack = document.getElementById('lightbox-track');
                track.innerHTML = '';
                lbTrack.innerHTML = '';
                
                galleryImages.forEach((imgUrl, index) => {
                    // Solo la primera imagen carga con prioridad alta
                    const fetchPriority = index === 0 ? 'high' : 'auto';
                    const loadingAttr = index === 0 ? 'eager' : 'lazy';
                    
                    // Inyección Carrusel Principal (Envuelto en un div con overflow-hidden para evitar cruces visuales en el zoom)
                    track.innerHTML += `
                        <div class="w-full h-full flex-shrink-0 overflow-hidden">
                            <img src="${imgUrl}" fetchpriority="${fetchPriority}" loading="${loadingAttr}" decoding="async" alt="${product.title} - vista ${index + 1}" class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105">
                        </div>
                    `;
                    
                    // Inyección Carrusel Lightbox
                    lbTrack.innerHTML += `
                        <div class="lb-slide-wrapper w-full h-full flex-shrink-0 flex items-center justify-center">
                            <img id="lb-img-${index}" src="${imgUrl}" loading="${loadingAttr}" decoding="async" alt="Vista ampliada ${index + 1}" onclick="toggleZoom(event)" class="max-w-full max-h-full object-contain transition-transform duration-300 origin-center select-none cursor-zoom-in relative z-20" style="transform: translate(0px, 0px) scale(1);">
                        </div>
                    `;
                });
                
                document.getElementById('lightbox-counter-total').textContent = galleryImages.length;
                
                // 2. Llenamos las miniaturas
                const thumbContainer = document.getElementById('thumbnails-container');
                thumbContainer.innerHTML = '';
                
                galleryImages.forEach((imgUrl, index) => {
                    const btn = document.createElement('button');
                    btn.onclick = () => changeMainImage(index);
                    btn.className = `thumbnail-btn flex-shrink-0 w-[calc(25%-0.6rem)] lg:w-full relative bg-gray-100 rounded-md shadow-sm hover:shadow-md border-2 overflow-hidden aspect-square transition snap-start ${index === 0 ? 'thumb-active border-transparent opacity-100' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    // Aplicamos lazy loading a las miniaturas y encaje completo con object-contain
                    btn.innerHTML = `<img src="${imgUrl}" loading="lazy" decoding="async" class="w-full h-full object-contain" alt="Vista ${index + 1}">`;
                    thumbContainer.appendChild(btn);
                });
            }

            // Cargar Upsell / Sugerencias (Enviando el ID para que la Base de Datos no falle)
            const safeBrand = product.brand || '';
            const safeCategory = product.category || '';
            let related = await fetchRelatedProducts(safeBrand, safeCategory, product.id);
            
            // 1. Filtrar productos para asegurar que tengan stock y no sean el actual
            let availableRelated = related.filter((item) => {
                const isOutOfStock = (item.availability || '').trim().toLowerCase() === 'out of stock';
                return item.id != product.id && !isOutOfStock;
            });

            // 2. Mezclar el array aleatoriamente para que los productos varíen en cada visita
            availableRelated = availableRelated.sort(() => Math.random() - 0.5);

            // 3. Cortar el array para mostrar un máximo de 4 opciones distintas
            const finalRelated = availableRelated.slice(0, 4);

            const grid = document.getElementById('related-products-grid');
            grid.innerHTML = '';
            
            finalRelated.forEach((item) => {
                const itemPrice = parseFloat(item.price) || 0;
                const itemSalePrice = parseFloat(item.sale_price) || itemPrice || 0;
                
                // Lógica visual de Precios/Ofertas idéntica a colecciones.html
                let priceHtml = '';
                let badgeHtml = '';
                let imageClasses = 'product-img w-full h-full object-cover transition-transform duration-700';
                const imageLink = item.image_link || 'https://placehold.co/400x400?text=No+Image';
                
                if (itemPrice > itemSalePrice) {
                    // Producto en oferta
                    badgeHtml = `<span class="absolute bottom-2 left-2 bg-gradient-to-r from-red-500 to-yellow-400 text-white text-[10px] sm:text-xs font-bold px-2 py-1 sm:px-2.5 sm:py-1.5 uppercase rounded z-10 shadow-sm flex items-center gap-1"><i class="fa-solid fa-fire"></i> Oferta</span>`;
                    priceHtml = `
                        <span class="font-semibold text-[14px] sm:text-lg lg:text-xl text-red-600 leading-none">Bs. ${itemSalePrice.toFixed(2)}</span>
                        <span class="text-gray-400 line-through text-[11px] sm:text-[14px] leading-none">Bs. ${itemPrice.toFixed(2)}</span>
                    `;
                } else {
                    // Precio normal
                    priceHtml = `<span class="font-semibold text-[14px] sm:text-lg lg:text-xl text-gray-900 leading-none">Bs. ${itemSalePrice.toFixed(2)}</span>`;
                }
                
                // Renderizado idéntico a colecciones.html manteniendo la clase w-[70%] y snap-start del carrusel móvil
                grid.innerHTML += `
                <a href="producto.html?id=${item.id}" class="product-card group relative flex flex-col cursor-pointer flex-shrink-0 w-[70%] sm:w-[45%] md:w-auto snap-start bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.06)] hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.12)] border-2 border-gray-200 hover:border-gray-300 transition-all duration-300 overflow-hidden">
                    <div class="relative bg-gray-100 aspect-square overflow-hidden">
                        ${badgeHtml}
                        <img src="${imageLink}" loading="lazy" decoding="async" alt="${item.title}" class="${imageClasses}">
                    </div>
                    <div class="flex flex-col flex-1 p-3 pt-2">
                        <h3 class="text-[14px] sm:text-base font-medium leading-tight text-gray-800 group-hover:text-blue-600 transition-colors line-clamp-2">${item.title}</h3>
                        <p class="text-gray-500 text-[12px] sm:text-[13px] mt-0.5 mb-1 line-clamp-1">${item.category || item.brand || 'Varios'}</p>
                        <div class="mt-auto pt-0.5 flex items-center gap-1.5">
                            ${priceHtml}
                        </div>
                    </div>
                </a>`;
            });
        }

        // Ejecutar inicializador al cargar el DOM
        document.addEventListener('DOMContentLoaded', initProductPage);

        // --- FUNCIONES DE INTERFAZ (Galería, Zoom y Botones) ---
        function changeMainImage(index) {
            currentImageIndex = index;
            
            // Efecto deslizamiento del carrusel Principal
            const track = document.getElementById('carousel-track');
            if(track) {
                track.style.transition = ''; // Restaura animaciones de tailwind
                track.style.transform = `translateX(-${index * 100}%)`;
            }
            
            // Efecto deslizamiento del carrusel Lightbox
            const lbTrack = document.getElementById('lightbox-track');
            if(lbTrack) {
                lbTrack.style.transition = ''; // Restaura animaciones de tailwind
                lbTrack.style.transform = `translateX(-${index * 100}%)`;
            }

            // Actualizar el contador de la vista completa
            const lbCounter = document.getElementById('lightbox-counter');
            if(lbCounter) lbCounter.innerText = index + 1;
            
            const btns = document.querySelectorAll('.thumbnail-btn');
            btns.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('thumb-active', 'border-transparent');
                    btn.classList.remove('opacity-60');
                    btn.style.opacity = '1';
                } else {
                    btn.classList.remove('thumb-active', 'ring-2', 'ring-black');
                    btn.classList.add('border-transparent', 'opacity-60');
                    btn.style.opacity = '0.6';
                }
            });
            
            const container = document.getElementById('thumbnails-container');
            if(btns[index]) {
               btns[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function navigateMainImage(e, direction) {
            if (e && e.stopPropagation) e.stopPropagation();
            if(galleryImages.length === 0) return;
            
            let newIndex = currentImageIndex + direction;
            if (newIndex < 0) newIndex = galleryImages.length - 1;
            if (newIndex >= galleryImages.length) newIndex = 0;
            changeMainImage(newIndex);
        }

        let isLightboxClosing = false; // Flag para controlar transiciones y el botón atrás

        function openLightbox(e) {
            // Evita que un simple toque al arrastrar abra la imagen gigante
            if (isMainDragging || galleryImages.length === 0) return;

            const lightbox = document.getElementById('lightbox');
            
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
            
            document.body.style.overflow = 'hidden';
            resetZoom();

            // Guardamos un estado en el historial para interceptar el botón "Atrás" del dispositivo
            history.pushState({ modal: 'lightbox' }, '', '');
        }

        function closeLightbox(fromHistory = false) {
            if (isLightboxClosing) return;
            isLightboxClosing = true;

            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
                document.body.style.overflow = '';
                isLightboxClosing = false; // Reiniciamos la bandera
            }, 300);

            // Si se cerró tocando la 'X' o la pantalla, limpiamos el estado virtual que creamos en el historial
            if (!fromHistory && history.state && history.state.modal === 'lightbox') {
                history.back();
            }
        }

        // Intercepta el evento del botón "Atrás" del navegador/móvil
        window.addEventListener('popstate', (e) => {
            const lightbox = document.getElementById('lightbox');
            // Si el lightbox está visible al pulsar "Atrás", lo cerramos en lugar de salir de la página
            if (lightbox && !lightbox.classList.contains('hidden') && !isLightboxClosing) {
                closeLightbox(true); // Pasamos 'true' porque la orden ya vino del historial
            }
        });

        function navigateLightbox(dir) {
            if(galleryImages.length === 0) return;
            let newIndex = currentImageIndex + dir;
            if (newIndex < 0) newIndex = galleryImages.length - 1;
            if (newIndex >= galleryImages.length) newIndex = 0;
            
            changeMainImage(newIndex);
            resetZoom();
        }

        // ==========================================
        // SWIPE PRINCIPAL CON ARRASTRE EN TIEMPO REAL
        // ==========================================
        const mainImageContainer = document.getElementById('main-image-container');
        let mainDragStartX = 0;
        let mainDragStartY = 0;
        let mainDragOffset = 0;
        let isMainDragging = false;
        let mainIsScrolling = null; // null: inicio, true: scroll vertical, false: scroll horizontal

        if (mainImageContainer) {
            mainImageContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) return; // Ignora multitouch aquí
                mainDragStartX = e.touches[0].clientX;
                mainDragStartY = e.touches[0].clientY;
                isMainDragging = true;
                mainIsScrolling = null;
                mainDragOffset = 0;
                
                // Desactiva la transición temporalmente para que la pista siga al dedo sin retraso
                const track = document.getElementById('carousel-track');
                if (track) track.style.transition = 'none';
            }, {passive: true});

            mainImageContainer.addEventListener('touchmove', (e) => {
                if (!isMainDragging) return;
                
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const deltaX = currentX - mainDragStartX;
                const deltaY = currentY - mainDragStartY;

                // Determina rápidamente si la persona intenta ir hacia abajo (scroll) o a los lados (swipe)
                if (mainIsScrolling === null) {
                    mainIsScrolling = Math.abs(deltaY) > Math.abs(deltaX);
                }

                // Si va hacia abajo, abortamos el arrastre del carrusel y dejamos que la página baje normal
                if (mainIsScrolling) return; 

                // Evitamos que la página brinque hacia los lados mientras deslizamos la imagen
                if (e.cancelable) e.preventDefault(); 

                // Crea resistencia si intentas deslizar en la primera o última foto
                if ((currentImageIndex === 0 && deltaX > 0) || (currentImageIndex === galleryImages.length - 1 && deltaX < 0)) {
                    mainDragOffset = deltaX * 0.3; 
                } else {
                    mainDragOffset = deltaX;
                }

                // Calcula y aplica el movimiento exacto
                const trackWidth = mainImageContainer.offsetWidth;
                const percentOffset = (mainDragOffset / trackWidth) * 100;
                const baseOffset = -(currentImageIndex * 100);
                
                const track = document.getElementById('carousel-track');
                if (track) track.style.transform = `translateX(${baseOffset + percentOffset}%)`;
            }, {passive: false});

            mainImageContainer.addEventListener('touchend', (e) => {
                if (!isMainDragging || mainIsScrolling) {
                    isMainDragging = false;
                    return;
                }
                isMainDragging = false;
                
                // Restaura la animación CSS natural
                const track = document.getElementById('carousel-track');
                if (track) track.style.transition = ''; 

                // Umbral: ¿Se movió lo suficiente como para cambiar de foto?
                const threshold = 50; 

                if (mainDragOffset < -threshold && currentImageIndex < galleryImages.length - 1) {
                    navigateMainImage(null, 1);
                } else if (mainDragOffset > threshold && currentImageIndex > 0) {
                    navigateMainImage(null, -1);
                } else {
                    // Si no se movió lo suficiente, rebota a la posición actual
                    changeMainImage(currentImageIndex); 
                }
            });
        }


        // ==========================================
        // LÓGICA DE LIGHTBOX (ZOOM + SWIPE EN TIEMPO REAL)
        // ==========================================
        let currentScale = 1, touchStartDist = 0, initialScale = 1, isPinching = false, isDragging = false;
        let startX = 0, startY = 0, translateX = 0, translateY = 0, lbSwipeStartX = 0, isLbSwiping = false;
        let lastTapX = 0, lastTapY = 0; 
        let zoomOriginTimeout; 
        let lbDragOffset = 0;
        let isMouseDown = false;
        let mouseDragMoved = false;

        function toggleZoom(e) {
            e.stopPropagation(); 
            if (mouseDragMoved) return; // Evita quitar el zoom si se estaba arrastrando la imagen
            clearTimeout(zoomOriginTimeout);
            
            const img = document.getElementById('lb-img-' + currentImageIndex);
            const hint = document.getElementById('zoom-hint');
            
            if(!img) return;

            isZoomed = !isZoomed;
            
            if (isZoomed) {
                currentScale = 2.5;
                img.classList.replace('cursor-zoom-in', 'cursor-zoom-out');
                if(hint) hint.classList.add('opacity-0');
                if(hint) hint.classList.remove('group-hover:opacity-100');
                
                const rect = img.getBoundingClientRect();
                
                let clientX = e.clientX;
                let clientY = e.clientY;
                
                if (window.matchMedia("(pointer: coarse)").matches || e.pointerType === 'touch' || (clientX === 0 && clientY === 0)) {
                    clientX = lastTapX || clientX;
                    clientY = lastTapY || clientY;
                }

                clientX = clientX || (rect.left + rect.width / 2);
                clientY = clientY || (rect.top + rect.height / 2);

                const x = ((clientX - rect.left) / rect.width) * 100;
                const y = ((clientY - rect.top) / rect.height) * 100;
                
                img.style.transformOrigin = `${x}% ${y}%`;
                img.style.transform = `translate(0px, 0px) scale(${currentScale})`;
            } else {
                resetZoom();
            }
        }

        function resetZoom() {
            isZoomed = false;
            currentScale = 1;
            translateX = 0;
            translateY = 0;
            mouseDragMoved = false;
            
            galleryImages.forEach((_, i) => {
               const img = document.getElementById('lb-img-' + i);
               if(img) {
                   img.classList.remove('cursor-zoom-out');
                   img.classList.add('cursor-zoom-in');
                   img.style.cursor = '';
                   img.style.transform = 'translate(0px, 0px) scale(1)';
               }
            });
            
            const activeImg = document.getElementById('lb-img-' + currentImageIndex);
            if(activeImg) {
                clearTimeout(zoomOriginTimeout);
                zoomOriginTimeout = setTimeout(() => { activeImg.style.transformOrigin = 'center center'; }, 300);
            }
            
            const hint = document.getElementById('zoom-hint');
            if(hint) {
                hint.classList.remove('opacity-0');
                hint.classList.add('group-hover:opacity-100');
            }
        }

        const lightboxTrackContainer = document.getElementById('lightbox-track-container');

        if(lightboxTrackContainer) {
            lightboxTrackContainer.addEventListener('touchstart', (e) => {
                const img = document.getElementById('lb-img-' + currentImageIndex);
                if (!img) return;

                if (e.touches.length === 2) {
                    isPinching = true; isDragging = false; isLbSwiping = false;
                    touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    initialScale = currentScale;
                    img.style.transition = 'none';
                } else if (e.touches.length === 1) {
                    lastTapX = e.touches[0].clientX;
                    lastTapY = e.touches[0].clientY;

                    if (currentScale > 1) {
                        // Modo arrastre de imagen ampliada
                        isDragging = true; isPinching = false; isLbSwiping = false;
                        startX = e.touches[0].clientX - translateX;
                        startY = e.touches[0].clientY - translateY;
                        img.style.transition = 'none';
                    } else {
                        // Modo arrastre del carrusel Lightbox
                        isLbSwiping = true; 
                        lbSwipeStartX = e.touches[0].clientX;
                        lbDragOffset = 0;
                        const lbTrack = document.getElementById('lightbox-track');
                        if(lbTrack) lbTrack.style.transition = 'none';
                    }
                }
            });

            lightboxTrackContainer.addEventListener('touchmove', (e) => {
                const img = document.getElementById('lb-img-' + currentImageIndex);
                if (!img) return;

                if (isPinching && e.touches.length === 2) {
                    // Acción de pellizcar para Zoom
                    e.preventDefault();
                    const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    currentScale = Math.min(Math.max(1, initialScale * (currentDist / touchStartDist)), 4);
                    
                    // CORRECCIÓN: Se eliminó el "img.style.transformOrigin = 'center center';" que reiniciaba forzosamente 
                    // la imagen al centro ignorando el clic previo. Ahora el escalado fluye desde donde estabas.
                    
                    img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
                    
                    const hint = document.getElementById('zoom-hint');
                    if(hint) hint.classList.add('opacity-0');

                } else if (isDragging && e.touches.length === 1) {
                    // Mover la imagen ampliada
                    e.preventDefault();
                    translateX = e.touches[0].clientX - startX;
                    translateY = e.touches[0].clientY - startY;
                    img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
                } else if (isLbSwiping && e.touches.length === 1) {
                    // ARRASTRE DEL CARRUSEL LIGHTBOX EN TIEMPO REAL
                    const currentX = e.touches[0].clientX;
                    const deltaX = currentX - lbSwipeStartX;
                    
                    if ((currentImageIndex === 0 && deltaX > 0) || (currentImageIndex === galleryImages.length - 1 && deltaX < 0)) {
                        lbDragOffset = deltaX * 0.3; // Resistencia
                    } else {
                        lbDragOffset = deltaX;
                    }

                    const trackWidth = lightboxTrackContainer.offsetWidth;
                    const percentOffset = (lbDragOffset / trackWidth) * 100;
                    const baseOffset = -(currentImageIndex * 100);
                    
                    const lbTrack = document.getElementById('lightbox-track');
                    if(lbTrack) lbTrack.style.transform = `translateX(${baseOffset + percentOffset}%)`;
                }
            });

            lightboxTrackContainer.addEventListener('touchend', (e) => {
                const img = document.getElementById('lb-img-' + currentImageIndex);
                
                // Finaliza el deslizamiento del carrusel
                if (isLbSwiping && currentScale === 1) {
                    isLbSwiping = false;
                    const lbTrack = document.getElementById('lightbox-track');
                    if(lbTrack) lbTrack.style.transition = ''; 
                    
                    const threshold = 50;
                    if (lbDragOffset < -threshold && currentImageIndex < galleryImages.length - 1) {
                        navigateLightbox(1);
                    } else if (lbDragOffset > threshold && currentImageIndex > 0) {
                        navigateLightbox(-1);
                    } else {
                        changeMainImage(currentImageIndex); // Rebote
                    }
                }
                
                if (e.touches.length < 2) isPinching = false;
                if (e.touches.length === 0) isDragging = false;
                
                if(img && currentScale > 1) {
                    img.style.transition = 'transform 0.3s ease-out';
                }

                if (currentScale <= 1 && !isLbSwiping) {
                    resetZoom(); 
                }
            });

            // --- EVENTOS DE MOUSE PARA MOVER ZOOM EN ESCRITORIO ---
            lightboxTrackContainer.addEventListener('mousedown', (e) => {
                const img = document.getElementById('lb-img-' + currentImageIndex);
                // Solo activar si hay zoom y es clic izquierdo
                if (!img || currentScale <= 1 || e.button !== 0) return; 
                
                e.preventDefault(); // Evita arrastrar la imagen por defecto del navegador (Ghost Image)
                isMouseDown = true;
                mouseDragMoved = false;
                
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                
                img.style.transition = 'none';
                img.classList.remove('cursor-zoom-out');
                img.style.cursor = 'grabbing'; // Cambia el cursor a una manito agarrando
            });

            lightboxTrackContainer.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                mouseDragMoved = true;
                
                const img = document.getElementById('lb-img-' + currentImageIndex);
                if (!img) return;
                
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
            });

            window.addEventListener('mouseup', () => {
                if (isMouseDown) {
                    isMouseDown = false;
                    const img = document.getElementById('lb-img-' + currentImageIndex);
                    if (img) {
                        img.style.transition = 'transform 0.3s ease-out';
                        img.style.cursor = '';
                        if (currentScale > 1) img.classList.add('cursor-zoom-out');
                    }
                    // Pequeño retraso antes de permitir el click para que no haga zoom out accidental
                    setTimeout(() => mouseDragMoved = false, 50);
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        });

        // Controles de cantidad
        function updateQty(change) {
            const input = document.getElementById('qty-input');
            let current = parseInt(input.value) || 1;
            let newVal = current + change;
            if (newVal >= 1) input.value = newVal;
        }

        // --- Lógica de Compra Directa por WhatsApp ---
        const buyNowBtn = document.getElementById('buy-now-whatsapp');
        if (buyNowBtn) {
            buyNowBtn.addEventListener('click', () => {
                const name = buyNowBtn.dataset.name;
                const sku = buyNowBtn.dataset.sku;
                const price = parseFloat(buyNowBtn.dataset.price);
                const id = buyNowBtn.dataset.id; // Recuperamos el ID de la tabla
                
                const qtyInput = document.getElementById('qty-input');
                const qty = parseInt(qtyInput ? qtyInput.value : 1);
                
                // Construimos la URL limpia usando el ID de tu tabla (ej: dominio.com/producto.html?id=355)
                const url = `${window.location.origin}/producto.html?id=${id}`;
                
                const total = price * qty;
                
                let message = "¡Hola Arelyshop! 👋 Quiero finalizar mi pedido:\n\n";
                message += `➡️ ${qty}x ${name} (Ref: ${sku})\n`;
                message += `Precio unitario: ${price.toFixed(2)} Bs.\n`;
                message += `🔗 ${url}\n\n`;
                message += `-----------------------------------\n`;
                message += `Total del Pedido: ${total.toFixed(2)} Bs.\n\n`;
                message += `Espero las instrucciones para el pago y envío. ¡Gracias!`;
                
                const phone = "59167500044";
                const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
                
                window.open(whatsappUrl, '_blank');
            });
        }
    </script>
</body>
